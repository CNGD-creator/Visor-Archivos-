name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Descargar librerías (para uso sin conexión)
        run: |
          mkdir -p app/src/main/assets/libs
          cd app/src/main/assets/libs
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fLO $B/mammoth/1.6.0/mammoth.browser.min.js
          curl -fLO $B/xlsx/0.18.5/xlsx.full.min.js
          curl -fLO $B/pdf.js/3.11.174/pdf.min.js
          curl -fLO $B/pdf.js/3.11.174/pdf.worker.min.js
          curl -fLO $B/jszip/3.10.1/jszip.min.js
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VisorArchivos-apk
          path: app/build/outputs/apk/debug/*.apk
